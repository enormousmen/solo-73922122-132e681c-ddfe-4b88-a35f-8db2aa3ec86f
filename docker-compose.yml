services:
  trainer:
    build: .
    image: resumable-trainer:latest
    container_name: resumable-trainer
    ports:
      - "8000:8000"
    environment:
      RUNS_DIR: /app/runs
      CONFIG_PATH: /app/config/default.json
      # Set to 1 only for chaos testing (enables POST /test/crash).
      ENABLE_TEST_CRASH_ENDPOINT: "0"
    volumes:
      # Checkpoints survive `docker kill` + `docker compose start`.
      - trainer-runs:/app/runs
      # The default CSV is a bind mount so the "replace the CSV" demo is
      # possible without rebuilding: edit ./data/classification.csv on the
      # host, then `docker compose restart trainer`.
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped

volumes:
  trainer-runs:
